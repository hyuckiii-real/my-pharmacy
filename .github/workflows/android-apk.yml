name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.hyuckiii --project-name my_pharmacy "$RUNNER_TEMP/my_pharmacy_platform"
          cp -R "$RUNNER_TEMP/my_pharmacy_platform/android" ./android

      - name: Configure scheduled notifications
        run: python3 tool/prepare_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Collect Android OCR diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/ocr-diagnostics
          flutter --version > build/ocr-diagnostics/flutter-version.txt 2>&1 || true
          find build/app/intermediates -type f -name AndroidManifest.xml -print -exec cp --parents {} build/ocr-diagnostics/ \; 2>/dev/null || true
          find build/app/outputs/logs -type f -iname '*manifest*report*' -print -exec cp --parents {} build/ocr-diagnostics/ \; 2>/dev/null || true
          find build/app/outputs/mapping -type f -name mapping.txt -print -exec cp --parents {} build/ocr-diagnostics/ \; 2>/dev/null || true
          find build/app/outputs -type f -name '*proguard*' -print -exec cp --parents {} build/ocr-diagnostics/ \; 2>/dev/null || true
          (cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath) > build/ocr-diagnostics/release-runtime-dependencies.txt 2>&1 || true
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -n "$AAPT" ] && [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            "$AAPT" dump xmltree build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml > build/ocr-diagnostics/apk-manifest.txt 2>&1 || true
          fi
          grep -R -n -E 'MlKitInitProvider|MlKitComponentDiscoveryService|TextRegistrar|CommonComponentRegistrar|text-recognition-korean|isMinifyEnabled|isShrinkResources' build/app/intermediates build/app/outputs/mapping 2>/dev/null > build/ocr-diagnostics/ocr-registration-summary.txt || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-pharmacy-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-pharmacy-ocr-diagnostics
          path: build/ocr-diagnostics
          if-no-files-found: warn
