name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.hyuckiii --project-name my_pharmacy "$RUNNER_TEMP/my_pharmacy_platform"
          cp -R "$RUNNER_TEMP/my_pharmacy_platform/android" ./android

      - name: Configure scheduled notifications
        run: python3 tool/prepare_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-pharmacy-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
